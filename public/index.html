<script>
'use strict';
/* ====================== utilidades ====================== */
var qs = new URLSearchParams(location.search);
var circleId = qs.get('circle'); // sin ?circle= se abre la lista de círculos
var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
var $ = function (id) { return document.getElementById(id); };
function guardar(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
function leer(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }

// Íconos del sistema de diseño (trazo 2px, cuadrícula de 24px)
var ICONOS = {
  check: '<path d="M5 12.5l4.5 4.5L19 7.5"/>',
  x: '<path d="M6 6l12 12M18 6L6 18"/>',
  alerta: '<path d="M12 4.2L21 19.5H3z"/><path d="M12 10v4.2M12 17.2h.01"/>',
  reloj: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  info: '<circle cx="12" cy="12" r="9"/><path d="M12 11v5.2M12 8h.01"/>',
  billetera: '<rect x="3" y="6" width="18" height="13" rx="3"/><path d="M3 10h18"/><path d="M16.5 14.5h.01"/>',
  flecha: '<path d="M5 12h14M13 6l6 6-6 6"/>',
  atras: '<path d="M19 12H5M11 6l-6 6 6 6"/>',
  libro: '<path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z"/><path d="M5 17a3 3 0 0 1 3-3h11"/>',
  escudo: '<path d="M12 3l7 3v5c0 5-3 8-7 10-4-2-7-5-7-10V6z"/><path d="M9 12l2 2 4-4"/>',
  candado: '<rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>',
  personas: '<path d="M16 19v-1a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v1"/><circle cx="10" cy="8" r="3"/><path d="M20 19v-1a4 4 0 0 0-3-3.9M15.5 5.2a3 3 0 0 1 0 5.6"/>',
  refrescar: '<path d="M20 11a8 8 0 1 0-2.3 5.7M20 5v6h-6"/>',
  externo: '<path d="M14 4h6v6M20 4l-9 9"/><path d="M18 14v4a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4"/>',
  abajo: '<path d="M6 9l6 6 6-6"/>',
  cuenta: '<circle cx="12" cy="8" r="4"/><path d="M4 20a8 8 0 0 1 16 0"/>',
  t_cadena: '<path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/>',
  t_natillera: '<path d="M6 9h12v10a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2z"/><path d="M5 4h14v5H5z"/><path d="M10 15h4"/>',
  t_circulo: '<path d="M12 20s-7-4.5-7-10a4 4 0 0 1 7-2.5A4 4 0 0 1 19 10c0 5.5-7 10-7 10z"/>',
  mas: '<path d="M12 5v14M5 12h14"/>',
  der: '<path d="M9 6l6 6-6 6"/>',
  casa: '<path d="M4 11l8-7 8 7v8a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1z"/>',
  entregas: '<circle cx="9" cy="9" r="5.5"/><path d="M14.5 9.8A5.5 5.5 0 1 1 9.8 14.5"/>',

  luna: '<path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/>'
};
function ico(n, c) { return '<svg class="cv-icono ' + (c || '') + '" viewBox="0 0 24 24" aria-hidden="true" focusable="false">' + ICONOS[n] + '</svg>'; }
var CARGADOR = '<svg class="cv-cargador cv-cargador--xs cv-cargador--mono" viewBox="0 0 64 64" aria-hidden="true" focusable="false"><circle class="m-p" cx="32.00" cy="11.00" r="7"/><circle class="m-p" cx="50.19" cy="21.50" r="7"/><circle class="m-s" cx="50.19" cy="42.50" r="7"/><circle class="m-p" cx="32.00" cy="53.00" r="7"/><circle class="m-a" cx="13.81" cy="42.50" r="7"/><circle class="m-p" cx="13.81" cy="21.50" r="7"/><circle class="m-c" cx="32" cy="32" r="4.5"/></svg>';

// Montos: COP 50.000 · USD 12,35. La moneda y la escala vienen siempre de la API; nunca se suponen.
function fmtMonto(a) {
  if (!a || a.value == null || a.assetScale == null) return null;
  var n = Number(a.value) / Math.pow(10, a.assetScale);
  return a.assetCode + ' ' + new Intl.NumberFormat('es-CO', { minimumFractionDigits: a.assetScale, maximumFractionDigits: a.assetScale }).format(n);
}
function fmtFecha(s) {
  if (!s) return '';
  var d = new Date(String(s).replace(' ', 'T') + 'Z');
  return isNaN(d) ? '' : d.toLocaleDateString('es-CO', { day: 'numeric', month: 'short' }).replace('.', '');
}
function fmtHora(iso) {
  var d = new Date(iso);
  return isNaN(d) ? '' : d.toLocaleTimeString('es-CO', { hour: '2-digit', minute: '2-digit' });
}
function iniciales(n) { return String(n).trim().split(/\s+/).slice(0, 2).map(function (p) { return p[0] || ''; }).join('').toUpperCase(); }
var PAISES = { CO: 'Colombia', US: 'Estados Unidos', MX: 'México', ES: 'España' };
function avatar(m, idx, extra) {
  var c = idx % 5; // color por orden, no por significado
  return '<span class="cv-avatar' + (c ? ' cv-avatar--' + (c + 1) : '') + (extra || '') + '" aria-hidden="true">' + esc(iniciales(m.name)) + '</span>';
}
function api(url, opts) {
  return fetch(url, opts).then(function (r) {
    return r.json().catch(function () { return {}; }).then(function (j) {
      if (!r.ok) { var e = new Error(j.error || 'Algo salió mal. Intenta de nuevo.'); e.status = r.status; throw e; }
      return j;
    });
  });
}
function post(url, body) { return api(url, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) }); }
function anunciar(t) { var a = $('anuncio'); a.textContent = ''; setTimeout(function () { a.textContent = t; }, 50); }

/* ====================== estado ====================== */
var S = { tab: 'inicio', view: 'cargando', data: null, me: null, pago: null, resultado: null, ocupado: false, huella: '' };

function yo() {
  if (!S.data) return null;
  var ms = S.data.members;
  var id = Number(leer('convite.yo.' + circleId));
  return ms.find(function (m) { return m.id === id; }) || ms[0] || null;
}
// Aprobaciones necesarias: las congela el backend en cada entrega (needed); si no vienen, se calculan con la proporción del círculo
function aprobNecesarias(d, p) {
  if (p && p.needed != null) return p.needed;
  var c = d.circle, pct = c.approvalPercent != null ? c.approvalPercent : c.approval_percent;
  if (pct) {
    var votantes = Math.max(1, d.members.length - (p && p.member_id ? 1 : 0)); // quien recibe no vota
    return Math.min(votantes, Math.max(1, Math.ceil(pct * votantes / 100 - 1e-9)));
  }
  return c.min_approvals;
}
function textoProporcion(pct) { return pct >= 100 ? 'todo el grupo' : pct > 50 && pct < 67 ? 'la mayoría del grupo' : pct === 50 ? 'la mitad del grupo' : pct + ' % del grupo'; }
function tieneIdentidad() { var id = Number(leer('convite.yo.' + circleId)); return !!(S.data && S.data.members.some(function (m) { return m.id === id; })); }
function destinoInicial() { return S.data && S.data.members.length && !tieneIdentidad() ? 'quien' : 'inicio'; }
function activoPote() { // moneda de la caja: la trae el círculo o sale del libro (receive); si no hay ninguna, no se inventa
  var c = S.data.circle;
  if (c && c.assetCode && c.assetScale != null) return { assetCode: c.assetCode, assetScale: c.assetScale };
  var l = (S.data.ledger || []).find(function (x) { return x.receive; });
  return l ? l.receive : null;
}
function indiceMiembro(id) { return S.data.members.findIndex(function (m) { return m.id === id; }); }

/* ====================== pasos del pago (stepper) ====================== */
var PASOS = [
  ['Solicitud', 'Pedimos permiso a tu billetera.'],
  ['Autorización', 'Apruébalo en tu billetera.'],
  ['Pago', 'Tu billetera envía el aporte.'],
  ['Listo', 'Queda anotado en el libro.']
];
var PASOS_ENTREGA = [
  ['Solicitud', 'Preparamos la entrega desde la caja.'],
  ['Autorización de la caja', 'Quien tiene la billetera de la caja la aprueba.'],
  ['Envío', 'La caja envía la plata.'],
  ['Listo', 'Queda anotado en el libro.']
];
function esEntrega() { return !!((S.pago && S.pago.tipo === 'entrega') || (S.resultado && S.resultado.entrega)); }
function pasosActual() { return esEntrega() ? PASOS_ENTREGA : PASOS; }
var ETQ = { completado: ['check', 'Hecho'], activo: ['reloj', 'En curso'], pendiente: ['reloj', 'Pendiente'], error: ['alerta', 'Falló'] };
function stepper(estados, detalles, compacto) {
  var activo = estados.indexOf('activo'), err = estados.indexOf('error');
  var actual = err >= 0 ? err : (activo >= 0 ? activo : estados.length - 1);
  var li = pasosActual().map(function (p, i) {
    var e = estados[i], det = (detalles && detalles[i]) || p[1];
    var marca = e === 'completado' ? ico('check') : e === 'error' ? ico('x') : e === 'activo' ? CARGADOR : String(i + 1);
    return '<li class="cv-paso cv-paso--' + e + '"' + (i === actual && e !== 'pendiente' ? ' aria-current="step"' : '') + '>' +
      '<span class="cv-paso__marca" aria-hidden="true">' + marca + '</span>' +
      '<div class="cv-paso__cuerpo"><div class="cv-paso__nombre"><span><span class="cv-sr">Paso ' + (i + 1) + ' de 4: </span>' + p[0] + '</span>' +
      '<span class="cv-paso__estado">' + ico(ETQ[e][0], 'cv-icono--xs') + ETQ[e][1] + '</span></div>' +
      '<p class="cv-paso__detalle">' + esc(det) + '</p></div></li>';
  }).join('');
  return '<ol class="cv-stepper' + (compacto ? ' cv-stepper--compacto' : '') + '" aria-label="Pasos del pago">' + li + '</ol>';
}
function resumenPaso(estados) {
  var i = estados.indexOf('error'); if (i < 0) i = estados.indexOf('activo'); if (i < 0) i = 3;
  return 'Paso ' + (i + 1) + ' de 4: ' + pasosActual()[i][0];
}

/* ====================== vistas ====================== */
function barraVolver(on, accion) {
  return '<div class="cv-barra" style="position:static">' + (on ? '<button type="button" class="cv-barra__volver" data-accion="' + (accion || 'inicio') + '">' + ico('atras') + 'Atrás</button>' : '<span></span>') + '</div>';
}

// "La caja": usa el pot del backend v2 si existe; si no, lo calcula del libro (aportes confirmados y entregas aprobadas)

    S.ocupado = false;
    if (variable && e.status === 400 && /aporte|monto|decimal/i.test(e.message)) { S.montoError = e.message; ir('monto'); return; }
    S.resultado = { texto: e.message, paso: 1, seguro: true };
    ir('error');
  });
}
function guardarPend(id) { try { sessionStorage.setItem(CLAVE_PEND, String(id)); } catch (e) {} }
function olvidarPend() { try { sessionStorage.removeItem(CLAVE_PEND); sessionStorage.removeItem(CLAVE_PENDP); } catch (e) {} }
function guardarPendP(id) { try { sessionStorage.setItem(CLAVE_PENDP, String(id)); } catch (e) {} }
function continuar() {
  ir('pago2');
  setTimeout(function () { if (S.view === 'pago2' && S.pago) location.assign(S.pago.redirectUrl); }, 900);
}
function aviso(tipo, titulo, texto) {
  var d = document.createElement('div');
  d.className = 'cv-aviso cv-aviso--' + tipo + ' is-entrando'; d.setAttribute('role', tipo === 'error' ? 'alert' : 'status');
  d.innerHTML = '<span class="cv-aviso__icono">' + ico(tipo === 'exito' ? 'check' : tipo === 'error' ? 'alerta' : 'info') + '</span><div><p class="cv-aviso__titulo">' + esc(titulo) + '</p><p class="cv-aviso__texto">' + esc(texto) + '</p></div>' +
    '<button type="button" class="cv-aviso__cerrar" aria-label="Cerrar aviso">' + ico('x') + '</button>';
  d.querySelector('button').addEventListener('click', function () { d.remove(); });
  $('avisos').appendChild(d);
  if (tipo !== 'error') setTimeout(function () { d.remove(); }, 7000);
}
function confirmar(o) {
  return new Promise(function (ok) {
    var previo = document.activeElement, cont = $('dialogos'), main = $('vista');
    cont.innerHTML = '<div class="cv-escudo"><div class="cv-dialogo" role="dialog" aria-modal="true" aria-labelledby="dlg-t" aria-describedby="dlg-x"><span class="cv-dialogo__icono">' + ico('check') + '</span>' +
      '<h2 class="cv-dialogo__titulo" id="dlg-t">' + esc(o.titulo) + '</h2><p class="cv-dialogo__texto" id="dlg-x">' + esc(o.texto) + '</p>' +
      '<div class="cv-dialogo__acciones"><button type="button" class="cv-btn cv-btn--primario cv-btn--bloque" data-r="si">' + esc(o.si) + '</button><button type="button" class="cv-btn cv-btn--fantasma cv-btn--bloque" data-r="no">' + esc(o.no) + '</button></div></div></div>';
    main.setAttribute('inert', '');
    var btns = cont.querySelectorAll('button');
    function cerrar(r) { cont.innerHTML = ''; main.removeAttribute('inert'); document.removeEventListener('keydown', tecla); if (previo && previo.focus) previo.focus(); ok(r); }
    function tecla(e) {
      if (e.key === 'Escape') { e.preventDefault(); cerrar(false); }
      if (e.key === 'Tab') { var i = Array.prototype.indexOf.call(btns, document.activeElement); e.preventDefault(); btns[(i + (e.shiftKey ? -1 : 1) + btns.length) % btns.length].focus(); }
    }
    btns.forEach(function (b) { b.addEventListener('click', function () { cerrar(b.dataset.r === 'si'); }); });
    document.addEventListener('keydown', tecla);
    btns[1].focus(); // foco en la opción menos riesgosa
  });
}
function aprobar(id) {
  var p = S.data.payouts.find(function (x) { return x.id === Number(id); }); if (!p) return;
  confirmar({ titulo: '¿Aprobar esta entrega?', texto: 'La entrega a ' + p.name + ' ' + (p.approvedBy.length + 1 >= aprobNecesarias(S.data, p) ? 'quedará aprobada con tu voto.' : 'sumará tu aprobación.'), si: 'Sí, aprobar', no: 'Todavía no' }).then(function (si) {
    if (!si) return;
    post('/api/payouts/' + id + '/approve', { memberId: S.me.id }).then(function (r) {
      aviso('exito', r.status === 'approved' ? 'Entrega aprobada' : 'Aprobación registrada', r.approvals + ' de ' + r.needed + ' aprobaciones.');
      cargar();
    }).catch(function (e) { aviso('error', 'No se pudo aprobar', e.message); });
  });
}
function pedirEntrega() {
  var c = S.data.circle, body = { memberId: S.me.id };
  S.entregaError = null;
  if (c.kind === 'circulo') {
    var campo = $('monto-entrega'), v = campo ? campo.value.trim().replace(',', '.') : '', pote = activoPote();
    if (!/^\d+(\.\d+)?$/.test(v) || Number(v) <= 0) { S.entregaError = 'Escribe un monto mayor que cero, por ejemplo 10.'; render(false); return; }
    body.amount = v;
    var mot = $('motivo'); if (mot && mot.value.trim()) body.purpose = mot.value.trim();
  }
  post('/api/circles/' + circleId + '/payouts', body).then(function () {
    aviso('exito', 'Entrega pedida', 'Ahora tu círculo la puede aprobar.'); cargar();
  }).catch(function (e) { S.entregaError = c.kind === 'circulo' ? e.message : null; if (c.kind === 'circulo') render(false); aviso('error', 'No se pudo pedir la entrega', e.message); });
}
function vistaAbrir(abrir) {
  var b = $('vista-boton'), l = $('vista-lista'); if (!b) return;
  var mostrar = abrir === undefined ? l.hidden : abrir;
  l.hidden = !mostrar; b.setAttribute('aria-expanded', String(mostrar));
  if (mostrar) { var sel = l.querySelector('[aria-selected="true"]') || l.firstElementChild; sel.focus(); } else b.focus();
}
function vistaElegir(id) {
  guardar('convite.yo.' + circleId, id);
  S.me = yo(); render(false);
  anunciar('Ahora ves el círculo como ' + S.me.name);
  $('vista-boton').focus();
}
function temaIcono() {
  var oscuro = document.documentElement.dataset.theme === 'dark', b = $('btn-tema');
  b.innerHTML = ico(oscuro ? 'sol' : 'luna');
  b.setAttribute('aria-label', oscuro ? 'Cambiar a modo claro' : 'Cambiar a modo oscuro');
}

/* ====================== eventos ====================== */
document.addEventListener('click', function (e) {
  if (S.view === 'arranque' && S.data) { ir(destinoInicial(), false); return; }
  var a = e.target.closest('[data-accion]'); if (!a) { var l = $('vista-lista'); if (l && !l.hidden && !e.target.closest('.cv-vista')) vistaAbrir(false); return; }
  var acc = a.dataset.accion;
  if (acc === 'pagar') pagar();
  else if (acc === 'continuar') continuar();
  else if (acc === 'inicio') { if (S.view === 'resumen' || S.view === 'pago2') olvidarPend(); S.pago = null; ir('inicio'); cargar(); }
  else if (acc === 'ver-libro') { S.tab = 'libro'; ir('inicio', false); var s = $('s-libro'); if (s) s.scrollIntoView({ behavior: 'smooth', block: 'start' }); }
  else if (acc === 'soy') { guardar('convite.yo.' + circleId, a.dataset.id); S.me = null; ir('inicio'); anunciar('Ahora ves el círculo como ' + (S.me ? S.me.name : '')); }
  else if (acc === 'abrir-circulo') location.assign('/?circle=' + encodeURIComponent(a.dataset.id));
  else if (acc === 'circulos') location.assign('/?lista=1');
  else if (acc === 'crear-circulo') { S.formC = null; S.formCError = null; ir('crear'); }
  else if (acc === 'agregar-miembro') { S.form = null; S.formError = null; ir('agregar'); }
  else if (acc === 'tab') { S.tab = a.dataset.tab; render(false); window.scrollTo(0, 0); anunciar('Sección ' + a.innerText.trim().split('\n')[0]); var nb = document.querySelector('.cv-nav [aria-current="page"]'); if (nb) nb.focus({ preventScroll: true }); window.scrollTo(0, 0); }
  else if (acc === 'comprobante') { S.compTipo = 'aporte'; S.compId = Number(a.dataset.id); ir('comprobante'); }
  else if (acc === 'comprobante-entrega') { S.compTipo = 'entrega'; S.compId = Number(a.dataset.id); ir('comprobante'); }
  else if (acc === 'ejecutar') ejecutar(a.dataset.id);
  else if (acc === 'ronda-siguiente') rondaSiguiente();
  else if (acc === 'proponer-cierre') proponerCierre();
  else if (acc === 'aprobar-cierre') aprobarCierre(a.dataset.id);
  else if (acc === 'ver-entregas') { S.tab = 'entregas'; ir('inicio', false); }
  else if (acc === 'imprimir') { // el PDF siempre sale en claro, aunque la pantalla esté en oscuro
    var tema = document.documentElement.dataset.theme; document.documentElement.dataset.theme = 'light';
    window.addEventListener('afterprint', function volver() { document.documentElement.dataset.theme = tema; window.removeEventListener('afterprint', volver); });
    window.print();
  }
  else if (acc === 'compartir') compartir();
  else if (acc === 'vista-abrir') vistaAbrir();
  else if (acc === 'vista-elegir') vistaElegir(a.dataset.id);
  else if (acc === 'aprobar') aprobar(a.dataset.id);
  else if (acc === 'pedir-entrega') pedirEntrega();
  else if (acc === 'recargar') { S.view = 'cargando'; render(false); cargar(); }
  else if (acc === 'tema') { var t = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'; document.documentElement.dataset.theme = t; guardar('convite.tema', t); temaIcono(); }
});
document.addEventListener('change', function (e) {
  if (e.target.name === 'c-tipo' && S.view === 'crear') { var g = function (id) { var el = $(id); return el ? el.value : ''; }; S.formC = { nombre: g('c-nombre').trim(), tipo: e.target.value, billetera: g('c-billetera').trim(), monto: g('c-monto'), aprob: g('c-aprob') || '50' }; render(false); var r = document.querySelector('input[name="c-tipo"]:checked'); if (r) r.focus(); }
});
document.addEventListener('submit', function (e) { if (e.target.id === 'form-monto') guardarMonto(e); else if (e.target.id === 'form-miembro') guardarMiembro(e); else if (e.target.id === 'form-circulo') guardarCirculo(e); });
document.addEventListener('keydown', function (e) {
  var l = $('vista-lista'); if (!l || l.hidden) return;
  var ops = Array.prototype.slice.call(l.children), i = ops.indexOf(document.activeElement);
  if (e.key === 'ArrowDown') { e.preventDefault(); ops[(i + 1) % ops.length].focus(); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); ops[(i - 1 + ops.length) % ops.length].focus(); }
  else if (e.key === 'Enter' || e.key === ' ') { if (i >= 0) { e.preventDefault(); if (ops[i].dataset.accion) ops[i].click(); else vistaElegir(ops[i].dataset.id); } }
  else if (e.key === 'Escape') { e.preventDefault(); vistaAbrir(false); }
});

/* ====================== arranque ====================== */
// Mensajes del callback (?ok=1 o ?error=texto). Se limpian de la URL para que al recargar no reaparezcan.
// "No se te cobró nada" solo se afirma en los casos que ocurren antes de crear el pago.
function clasificar(msg) {
  var antes = /rechaz|venci|Hash|inválid/i.test(msg), sinRed = /conectar|conexión/i.test(msg);
  return { texto: msg, paso: antes ? 2 : (sinRed ? 1 : 3), seguro: antes || sinRed };
}
function leerSesion(k) { try { return sessionStorage.getItem(k); } catch (e) { return null; } }
var CLAVE_PENDP = 'convite.pendp.' + circleId; // id de la entrega enviada a autorizar
var CLAVE_PEND = 'convite.pend.' + circleId; // id del aporte que mandamos a autorizar (solo en esta pestaña)
function leerResultado() {
  var ok = qs.get('ok'), err = qs.get('error'), po = qs.get('payout');
  if (!ok && !err && !po) return;
  history.replaceState(null, '', location.pathname + '?circle=' + circleId);
  try { sessionStorage.removeItem(CLAVE_PEND); sessionStorage.removeItem(CLAVE_PENDP); } catch (e) {}
  if (po) { S.tab = 'entregas'; var id = Number(qs.get('p')); S.resultado = po === 'ok' ? { entrega: true, ok: true, id: id } : Object.assign(clasificar(err || 'No se pudo enviar la entrega.'), { entrega: true, id: id }); return; }
  S.resultado = ok ? { ok: true } : clasificar(err);
}
// Si la persona volvió a mano (sin pasar por el callback), mostramos cómo terminó su aporte
function revisarPendiente() {
  var id = null, idp = null; try { id = sessionStorage.getItem(CLAVE_PEND); idp = sessionStorage.getItem(CLAVE_PENDP); } catch (e) {}
  if (S.resultado || (!id && !idp)) return Promise.resolve();
  if (idp) return api('/api/payouts/' + idp).then(function (p) {
    if (p.status === 'paying' || p.status === 'approved' || p.status === 'requested') return;
    try { sessionStorage.removeItem(CLAVE_PENDP); } catch (e) {}
    S.tab = 'entregas'; S.resultado = p.status === 'paid' ? { entrega: true, ok: true, id: p.id } : Object.assign(clasificar(p.error || 'No se pudo enviar la entrega.'), { entrega: true, id: p.id });
  }).catch(function () {});
  return api('/api/contributions/' + id).then(function (c) {
    if (c.status === 'pending' || c.status === 'processing') return;
    try { sessionStorage.removeItem(CLAVE_PEND); } catch (e) {}
    S.resultado = c.status === 'confirmed' ? { ok: true } : clasificar(c.error || 'No recibimos tu aprobación.');
  }).catch(function () {});
}
function iniciarCirculo() {
  leerResultado();
  if (!S.resultado && !leerSesion('convite.arranque')) { S.view = 'arranque'; S.minArranque = Date.now() + 3600; try { sessionStorage.setItem('convite.arranque', '1'); } catch (e) {} }
  render(false);
  cargar().then(revisarPendiente).then(function () {
    if (S.resultado && S.data) { ir(S.resultado.ok ? 'exito' : 'error'); if (S.resultado.ok) anunciar(S.resultado.entrega ? 'La entrega salió' : 'Tu aporte quedó confirmado'); }
  });
}
// Sin ?circle=: se muestra la lista. Si solo hay un círculo se abre directo (salvo que se pida la lista con ?lista=1).
function iniciarLista() {
  var forzar = qs.get('lista');
  if (!leerSesion('convite.arranque')) { S.view = 'arranque'; S.minArranque = Date.now() + 3600; try { sessionStorage.setItem('convite.arranque', '1'); } catch (e) {} }
  render(false);
  var tras = function (fn) { if (S.view === 'arranque') setTimeout(fn, Math.max(0, S.minArranque - Date.now())); else fn(); };
  api('/api/circles').then(function (r) {
    S.circulos = r.circles || r || [];
    if (S.circulos.length === 1 && !forzar) { tras(function () { location.replace('/?circle=' + encodeURIComponent(S.circulos[0].id)); }); return; }
    tras(function () { ir('circulos'); });
  }).catch(function () {
    // servidor sin lista de círculos: se comporta como antes, con el círculo 1
    location.replace('/?circle=1');
  });
}
temaIcono();
if (circleId) iniciarCirculo(); else iniciarLista();
setInterval(function () { if (S.view === 'inicio' && circleId) cargar(true); }, 5000);
</script>
